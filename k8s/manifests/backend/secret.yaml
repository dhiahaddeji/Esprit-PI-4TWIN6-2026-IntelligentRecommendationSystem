apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: assurreco
type: Opaque
stringData:
  # Copiez vos valeurs depuis Render / votre .env
  JWT_SECRET: "ChangeMe_JWT_Secret_Here"
  REFRESH_TOKEN_SECRET: "ChangeMe_Refresh_Secret_Here"
  GITHUB_CLIENT_ID: "your_github_client_id"
  GITHUB_CLIENT_SECRET: "your_github_client_secret"
  EMAIL_USER: "your@gmail.com"
  EMAIL_PASS: "your_app_password"
