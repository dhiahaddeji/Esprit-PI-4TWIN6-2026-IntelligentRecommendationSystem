apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: assurreco
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"

  dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: AssurReco
        orgId: 1
        folder: AssurReco
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
