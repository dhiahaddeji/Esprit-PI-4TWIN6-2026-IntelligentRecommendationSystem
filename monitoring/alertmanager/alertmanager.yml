global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "AssurReco Alerts <dhia.haddeji@esprit.tn>"
  smtp_auth_username: "dhia.haddeji@esprit.tn"
  smtp_auth_password: "keuxnmmynntcfdqa"
  smtp_require_tls: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: email-critical
  routes:
    - matchers:
        - severity="critical"
      receiver: email-critical
      continue: false
    - matchers:
        - severity="warning"
      receiver: email-warning
      group_interval: 10m
      repeat_interval: 8h
    - matchers:
        - severity="info"
      receiver: "null"

receivers:
  - name: "null"

  - name: email-critical
    email_configs:
      - to: "dhia.haddeji@esprit.tn"
        send_resolved: true
        headers:
          Subject: "[CRITICAL] AssurReco Alert: {{ .GroupLabels.alertname }}"
        html: |
          <h2 style="color:#c0392b">🚨 AssurReco — Critical Alert</h2>
          {{ range .Alerts }}
          <p><b>Alert:</b> {{ .Annotations.summary }}<br/>
          <b>Description:</b> {{ .Annotations.description }}<br/>
          <b>Status:</b> {{ .Status }}</p>
          {{ end }}

  - name: email-warning
    email_configs:
      - to: "dhia.haddeji@esprit.tn"
        send_resolved: true
        headers:
          Subject: "[WARNING] AssurReco Alert: {{ .GroupLabels.alertname }}"
        html: |
          <h2 style="color:#e67e22">⚠️ AssurReco — Warning</h2>
          {{ range .Alerts }}
          <p><b>Alert:</b> {{ .Annotations.summary }}<br/>
          <b>Description:</b> {{ .Annotations.description }}<br/>
          <b>Status:</b> {{ .Status }}</p>
          {{ end }}
