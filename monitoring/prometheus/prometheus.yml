global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: assurreco-monitoring

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # ── Prometheus self-monitoring ─────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── AssurReco Backend ─────────────────────────────────────────────────
  - job_name: assurreco-backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "assurreco-backend"

  # ── Node Exporter (host metrics) ──────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── MongoDB Exporter ──────────────────────────────────────────────────
  # - job_name: mongodb-exporter
  #   static_configs:
  #     - targets: ["mongodb-exporter:9216"]

  # ── Python ML Service ─────────────────────────────────────────────────
  # (add prometheus-fastapi-instrumentator to ml-service to enable)
