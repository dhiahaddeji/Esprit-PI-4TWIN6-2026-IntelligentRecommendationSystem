global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'nestjs-monitoring'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nestjs-backend'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'

  - job_name: 'react-frontend'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:5173']
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
